[project]
name = "enbd-backend"
version = "0.1.0"
description = "ENBD Expense Analyzer Backend API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "psycopg[binary]>=3.1.0",
    "pandas==2.2.0",
    "openpyxl==3.1.2",
    "python-dateutil==2.8.2",
    "openai==1.10.0",
    "python-dotenv==1.0.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
    "pytest-cov==4.1.0",
    "testcontainers==4.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

